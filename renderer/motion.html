<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="pi-plugin-chrome" content="v2"><title>Sax · 参考弹窗动效</title><link id="theme" rel="stylesheet" href="../themes/sax-light.css"><link rel="stylesheet" href="preview.css"><style>
/* Preview-only opt-in: never force motion in the installed host theme. */
:root[data-preview-motion="on"]{--sax-motion-fast:180ms;--sax-motion-menu:250ms;--sax-motion-dialog:250ms;--sax-motion-exit:150ms;--sax-motion-offset:6px;--sax-motion-scale:.96}
header{flex-wrap:wrap}header h1{font-size:28px}.motion-actions{display:flex;flex-wrap:wrap;gap:12px}.anchor{position:relative}
.context-menu{position:absolute;top:calc(100% + 8px);left:0;width:220px;padding:8px;background:var(--sax-raised);border-radius:8px;box-shadow:var(--sax-shadow-floating);opacity:0;visibility:hidden;pointer-events:none;z-index:5;transform:translateX(3px)}
.context-menu.is-open{opacity:1;visibility:visible;pointer-events:auto}.context-menu button{display:block;width:100%;text-align:left;box-shadow:none;background:transparent}.context-menu button:hover{background:var(--sax-primary-soft)}
.dialog{width:min(480px,calc(100vw - 32px));padding:28px;background:var(--sax-raised);color:var(--sax-ink);border:0;border-radius:8px;box-shadow:var(--sax-shadow-floating)}dialog::backdrop{background:hsl(245 40% 8% / .35)}.toast{position:fixed;bottom:24px;right:24px;max-width:calc(100vw - 48px);padding:16px;background:var(--sax-raised);border-radius:8px;box-shadow:var(--sax-shadow-large)}
#motion-status,#event-log{font-family:var(--font-mono);font-size:12px;overflow-wrap:anywhere}#event-log{white-space:pre-wrap}#force{margin-top:0}
</style><script src="dissolve-runtime-preview.js" defer></script><script src="motion.js" defer></script></head><body><main>
<header><h1>Sax 粒子弹窗</h1><button id="mode">切换深色</button></header><p>入场 250ms 缩放 · 关闭 220ms SVG 粒子溶解 · 独立视觉副本，不延迟原始关闭。</p>
<section class="card"><h2>实际播放状态</h2><p id="motion-status" role="status">正在读取…</p><button id="particles-toggle" aria-pressed="true">粒子开启：切换普通缩放退出</button><button id="force" aria-pressed="false">仅预览：强制播放普通动效</button><p class="note">粒子始终尊重系统减少动效。强制播放只用于普通 CSS 动效诊断。</p><a href="dissolve.html">任务删除／归档粒子试验 →</a></section>
<section class="card"><h2>弹出层交互</h2><p>点击打开，再用按钮、Escape 或遮罩关闭。日志由真实 animation 事件记录。</p><div class="motion-actions"><div class="anchor"><button id="menu-toggle" class="sax-button" aria-haspopup="menu" aria-expanded="false" aria-controls="demo-menu">打开菜单</button><div id="demo-menu" class="context-menu" role="menu" inert><button role="menuitem">新建会话</button><button role="menuitem">复制链接</button><button role="menuitem">查看设置</button></div></div><button id="dialog-open" class="sax-button">打开对话框</button><button id="toast-open" class="sax-button">显示提示</button></div><p id="result" role="status">准备就绪</p><pre id="event-log" aria-label="动画事件日志">等待操作</pre></section><a href="index.html">返回主题预览</a>
<dialog id="demo-dialog" class="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">表面化为细小粒子</h2><p>关闭后原始弹窗立即退出，由不可点击的视觉副本完成 SVG 噪声蚀解。</p><p class="note">可切换到普通缩放退出进行对照。任务删除／归档的误判防护在专用试验页中演示。</p><button id="dialog-close" class="sax-button">关闭</button></dialog>
</main></body></html>
