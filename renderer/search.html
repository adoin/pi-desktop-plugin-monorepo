<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="pi-plugin-chrome" content="v2"><title>Sax · 清晰搜索</title><style>
*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui;background:var(--sax-ambient);color:var(--sax-ink);min-height:100vh}.stage{padding:48px;max-width:1000px;margin:auto}button,a{font:inherit;border:0;padding:8px 12px;background:var(--sax-canvas);color:var(--sax-ink);cursor:pointer}h1{font-size:32px}.search-overlay{z-index:40;background:hsl(0 0% 0% / .45);display:flex;justify-content:center;align-items:flex-start;position:fixed;inset:0}.search-overlay[hidden]{display:none}.search-dialog{width:min(100%,620px);max-height:min(460px,100%);display:flex;flex-direction:column;overflow:hidden;background:var(--ds-bg-elevated-opaque)}.search-input-row{display:flex;align-items:center;flex:none}.search-input{flex:1;min-width:0;background:none;outline:none;border:0}.search-results{min-height:0;overflow-y:auto}.search-item{display:flex;align-items:center;width:100%;text-align:left}.search-session-details{display:flex;flex-direction:column;flex:1;min-width:0}.search-item-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.search-item-meta{display:flex;gap:6px}.search-item-icon{flex:none}#mode,#close{flex:none;font-size:12px}.search-empty[hidden]{display:none}.test-links{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
</style><link id="theme" rel="stylesheet" href="../themes/sax-light.css"><script src="search.js" defer></script></head><body>
<main class="stage"><h1>让搜索回到视觉中心。</h1><p>背景仍保留色彩，但不再透进结果。搜索面板使用独立实色表面与轻量遮罩。</p><button id="reopen">打开搜索预览</button><div class="test-links"><a href="motion.html">测试弹窗粒子</a><a href="dissolve.html">测试任务删除／归档粒子</a></div><p id="selection" role="status"></p><p>这段背景文字用于检查搜索结果是否受到背后内容的干扰。</p></main>
